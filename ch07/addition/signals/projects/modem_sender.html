<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FSK Modem — Sender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Courier New', monospace; background: #0d0d0d; color: #33ff33;
           max-width: 680px; margin: 40px auto; padding: 20px; }
    h1   { color: #00ffcc; margin-bottom: 2px; font-size: 1.2rem; }
    .sub { color: #555; font-size: 0.8rem; margin-bottom: 14px; }
    .row { font-size: 11px; color: #888; margin-bottom: 10px; }
    .row span { color: #0ff; }
    textarea { width: 100%; background: #111; color: #33ff33; border: 1px solid #33ff33;
               padding: 8px; font-family: monospace; font-size: 14px; resize: vertical; margin-bottom: 10px; }
    .ctrl { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
    button { background: #33ff33; color: #000; border: none; padding: 8px 16px;
             cursor: pointer; font-family: monospace; font-size: 13px; font-weight: bold; }
    button.stop { background: #ff3333; color: #fff; }
    label  { font-size: 11px; color: #888; }
    select { background: #111; color: #33ff33; border: 1px solid #555; padding: 3px 6px; font-family: monospace; }
    .carrier { height: 48px; border: 2px solid #333; background: #111;
               position: relative; margin-bottom: 10px; transition: border-color .06s; }
    .c-lbl { position: absolute; top: 50%; left: 12px; transform: translateY(-50%);
             font-size: 18px; font-weight: bold; transition: color .06s; }
    .c-frq { position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
             font-size: 11px; color: #888; }
    .bits  { font-size: 11px; letter-spacing: 2px; min-height: 20px;
             border: 1px solid #1a1a1a; padding: 3px 8px; margin-bottom: 8px; overflow: hidden; }
    .bits .s  { color: #ff0; } .bits .d1 { color: #33ff33; }
    .bits .d0 { color: #226622; } .bits .p  { color: #0ff; }
    #st  { color: #ff0; font-size: 12px; min-height: 16px; margin-bottom: 8px; }
    #log { height: 100px; overflow-y: auto; border: 1px solid #1a1a1a;
           padding: 4px 8px; font-size: 10px; color: #555; }
  </style>
</head>
<body>
<h1>FSK Modem — Sender</h1>
<p class="sub">Bell 202-style FSK · MARK=1 · SPACE=0 · 8N1 UART</p>
<div class="row">
  Mark(1): <span id="pM">1200 Hz</span> &nbsp;|&nbsp;
  Space(0): <span id="pS">2200 Hz</span> &nbsp;|&nbsp;
  Baud: <span id="pB">5</span> &nbsp;|&nbsp;
  Bit: <span id="pT">200 ms</span>
</div>
<textarea id="msg" rows="3">HELLO MODEM WORLD</textarea>
<div class="ctrl">
  <button onclick="startSending()">&#9654; Send</button>
  <button class="stop" onclick="stopSending()">&#9632; Stop</button>
  <label>Baud: <select id="bd"><option value="5" selected>5</option><option value="10">10</option><option value="20">20</option></select></label>
  <label>Mark Hz: <select id="mf"><option value="1200" selected>1200</option><option value="1270">1270</option></select></label>
  <label>Space Hz: <select id="sf"><option value="2200" selected>2200</option><option value="1070">1070</option></select></label>
</div>
<div class="carrier" id="car">
  <span class="c-lbl" id="cl">IDLE</span>
  <span class="c-frq" id="cf">—</span>
</div>
<div class="bits" id="bits">&nbsp;</div>
<div id="st">Press Send.</div>
<div id="log"></div>

<script>
const AMPLITUDE = 0.6;   // higher amplitude = easier to hear across the room
let MF = 1200, SF = 2200, BAUD = 5, BIT_MS = 200;

let actx = null, gain = null, osc = null;
let running = false, sid = 0;

function initAudio() {
  if (osc)  { try { osc.stop();      } catch(_){} osc  = null; }
  if (actx) { try { actx.close();    } catch(_){} actx = null; }
  actx = new AudioContext();
  gain = actx.createGain();
  gain.gain.value = AMPLITUDE;
  gain.connect(actx.destination);
  osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = MF;
  osc.connect(gain);
  osc.start();
}

function setF(f) {
  if (!osc || !actx) return;
  const t = actx.currentTime;
  osc.frequency.cancelScheduledValues(t);
  osc.frequency.setValueAtTime(osc.frequency.value, t);
  osc.frequency.linearRampToValueAtTime(f, t + 0.003);
}

function stopAudio() {
  if (!actx) return;
  const t = actx.currentTime;
  gain.gain.cancelScheduledValues(t);
  gain.gain.setValueAtTime(gain.gain.value, t);
  gain.gain.linearRampToValueAtTime(0, t + 0.03);
  const a = actx; actx = null; osc = null; gain = null;
  setTimeout(() => { try { a.close(); } catch(_){} }, 60);
}

// UI
const carEl = document.getElementById('car');
const clEl  = document.getElementById('cl');
const cfEl  = document.getElementById('cf');
const stEl  = document.getElementById('st');
const logEl = document.getElementById('log');

function showF(f) {
  const m = f === MF;
  clEl.textContent = m ? 'MARK  1' : 'SPACE  0';
  clEl.style.color = m ? '#33ff33' : '#ff3333';
  cfEl.textContent = f + ' Hz';
  carEl.style.borderColor = m ? '#33ff33' : '#ff3333';
}
function showIdle() {
  clEl.textContent = 'IDLE'; clEl.style.color = '#555';
  cfEl.textContent = '—'; carEl.style.borderColor = '#333';
}

let bh = [];
function pushBit(b, c) {
  bh.push({b,c}); if (bh.length > 88) bh.shift();
  document.getElementById('bits').innerHTML = bh.map(x=>`<span class="${x.c}">${x.b}</span>`).join('');
}
function log(m) { logEl.innerHTML += m+'<br>'; logEl.scrollTop = logEl.scrollHeight; }

// 8N1 framing: START(SPACE) + D0..D7 LSB-first + STOP(MARK)
function charBits(c) {
  const v = c.charCodeAt(0) & 0xFF;
  const b = [{b:0,c:'s'}];
  for (let i=0; i<8; i++) { const x=(v>>i)&1; b.push({b:x,c:x?'d1':'d0'}); }
  b.push({b:1,c:'p'});
  return b;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function sendBit(b, c) {
  setF(b ? MF : SF); showF(b ? MF : SF); pushBit(b, c);
  await sleep(BIT_MS);
}

async function sendChar(ch, alive) {
  const bits = charBits(ch);
  stEl.textContent = `'${ch}'  0x${ch.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0')}  [${bits.map(x=>x.b).join('')}]`;
  log(`  '${ch}' [${bits.map(x=>x.b).join('')}]`);
  for (const {b,c} of bits) { if (!alive()) return; await sendBit(b,c); }
}

async function startSending() {
  if (running) return;
  BAUD = +document.getElementById('bd').value;
  MF   = +document.getElementById('mf').value;
  SF   = +document.getElementById('sf').value;
  BIT_MS = Math.round(1000 / BAUD);
  document.getElementById('pM').textContent = MF  + ' Hz';
  document.getElementById('pS').textContent = SF  + ' Hz';
  document.getElementById('pB').textContent = BAUD;
  document.getElementById('pT').textContent = BIT_MS + ' ms';
  const text = document.getElementById('msg').value;
  if (!text) return;
  running = true;
  const myId = ++sid;
  const alive = () => running && sid === myId;
  bh = []; initAudio();
  try {
    // ── CALIBRATE: alternating tones so receiver sees both frequencies ──────
    // Receiver ignores this phase entirely (each MARK run < BIT_MS << SYNC_MS).
    const cb = Math.max(10, Math.ceil(800 / BIT_MS));
    stEl.textContent = 'CALIBRATING …'; log('── calibrate ──');
    for (let i=0; i<cb && alive(); i++) await sendBit(i%2, i%2?'d1':'d0');

    // ── GUARD: pure MARK for > SYNC_MS so receiver can lock ─────────────────
    // Receiver needs 600 ms of continuous MARK; we send ≥1400 ms.
    const gb = Math.max(14, Math.ceil(1400 / BIT_MS));
    stEl.textContent = 'GUARD (MARK) …'; log('── guard ──');
    for (let i=0; i<gb && alive(); i++) await sendBit(1,'p');

    // ── DATA ─────────────────────────────────────────────────────────────────
    log('── data ──');
    for (const c of text) { if (!alive()) break; await sendChar(c, alive); }

    // ── EOT ──────────────────────────────────────────────────────────────────
    if (alive()) { stEl.textContent='EOT'; log('── EOT ──'); await sendChar('\x04', alive); }
    if (alive()) { stEl.textContent='Done.'; log('── done ──'); }

  } finally {
    if (sid === myId) { running=false; stopAudio(); showIdle(); }
  }
}

function stopSending() {
  sid++; running=false; stopAudio(); showIdle(); stEl.textContent='Stopped.';
}
</script>
</body>
</html>
