<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="'Courier New', monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="420" fill="#0f172a" rx="12"/>

  <!-- Core 0 Box -->
  <rect x="20" y="20" width="360" height="370" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="20" width="360" height="32" rx="10" fill="#1d4ed8"/>
  <rect x="20" y="40" width="360" height="12" fill="#1d4ed8"/>
  <text x="200" y="41" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Core 0 — RTOS Scheduler</text>

  <!-- Core 1 Box -->
  <rect x="400" y="20" width="360" height="370" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="400" y="20" width="360" height="32" rx="10" fill="#065f46"/>
  <rect x="400" y="40" width="360" height="12" fill="#065f46"/>
  <text x="580" y="41" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Core 1 — Display Loop</text>

  <!-- === CORE 0 NODES === -->

  <!-- SysTick ISR -->
  <rect x="110" y="75" width="140" height="44" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="93" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">SysTick ISR</text>
  <text x="180" y="108" text-anchor="middle" fill="#64748b" font-size="10">(every 1 ms)</text>

  <!-- PendSV ISR -->
  <rect x="110" y="165" width="140" height="44" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="180" y="183" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">PendSV ISR</text>
  <text x="180" y="198" text-anchor="middle" fill="#64748b" font-size="10">(context switch)</text>

  <!-- Arrow SysTick → PendSV -->
  <line x1="180" y1="119" x2="180" y2="163" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="188" y="131" width="95" height="22" rx="3" fill="#0f172a"/>
  <text x="236" y="140" text-anchor="middle" fill="#475569" font-size="9">pend PendSV</text>
  <text x="236" y="151" text-anchor="middle" fill="#475569" font-size="9">(ICSR PENDSVSET)</text>

  <!-- Three task boxes -->
  <!-- led_task -->
  <rect x="44" y="265" width="110" height="44" rx="6" fill="#14302a" stroke="#10b981" stroke-width="1.2"/>
  <text x="99" y="283" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">led_task</text>
  <text x="99" y="298" text-anchor="middle" fill="#64748b" font-size="10">priority 2</text>

  <!-- counter_task -->
  <rect x="125" y="265" width="110" height="44" rx="6" fill="#14302a" stroke="#10b981" stroke-width="1.2"/>
  <text x="180" y="283" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">counter_task</text>
  <text x="180" y="298" text-anchor="middle" fill="#64748b" font-size="10">priority 1</text>

  <!-- idle_task -->
  <rect x="206" y="265" width="110" height="44" rx="6" fill="#14302a" stroke="#10b981" stroke-width="1.2"/>
  <text x="261" y="283" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">idle_task</text>
  <text x="261" y="298" text-anchor="middle" fill="#64748b" font-size="10">priority 0</text>

  <!-- PendSV → tasks arrows -->
  <!-- to led_task -->
  <line x1="155" y1="209" x2="99" y2="263" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- to counter_task -->
  <line x1="180" y1="209" x2="180" y2="263" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- to idle_task -->
  <line x1="205" y1="209" x2="261" y2="263" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- "selects highest priority READY task" label -->
  <text x="88" y="242" fill="#475569" font-size="9">selects highest-priority READY task</text>

  <!-- === CORE 1 NODES === -->

  <!-- 50ms render loop -->
  <rect x="450" y="120" width="160" height="44" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="530" y="138" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">50 ms render loop</text>
  <text x="530" y="153" text-anchor="middle" fill="#64748b" font-size="10">framebuffer → DMA</text>

  <!-- SPI0 + DMA box -->
  <rect x="450" y="230" width="160" height="56" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="530" y="250" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">SPI0 + DMA</text>
  <text x="530" y="265" text-anchor="middle" fill="#93c5fd" font-size="11">ST7789V2</text>
  <text x="530" y="279" text-anchor="middle" fill="#64748b" font-size="10">320 × 240</text>

  <!-- Arrow render → SPI -->
  <line x1="530" y1="164" x2="530" y2="228" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- === CROSS-CORE ARROW === -->
  <!-- Horizontal arrow from Core0 to Core1 at mid height -->
  <line x1="382" y1="210" x2="448" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="5,3"/>

  <!-- Cross-core label box -->
  <rect x="300" y="330" width="180" height="56" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="390" y="348" text-anchor="middle" fill="#60a5fa" font-size="9.5" font-weight="bold">volatile reads</text>
  <text x="390" y="361" text-anchor="middle" fill="#475569" font-size="8.5">tick_count, rtos_timeline,</text>
  <text x="390" y="373" text-anchor="middle" fill="#475569" font-size="8.5">g_count, g_led_on</text>

  <!-- lines from label box to arrow -->
  <line x1="390" y1="330" x2="390" y2="220" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
</svg>
